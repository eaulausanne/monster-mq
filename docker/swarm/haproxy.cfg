# HAProxy configuration for MonsterMQ Swarm cluster
#
# Load-balances MQTT (1883) and GraphQL (4000) across the 3 MonsterMQ replicas.
# Uses Docker Swarm DNS resolution via the overlay network.
#
# Adjust server hostnames to match your Swarm node hostnames appended with -monstermq.

global
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# MQTT load balancer (port 1883)
frontend mqtt_front
    bind *:1883
    default_backend mqtt_back

backend mqtt_back
    balance roundrobin
    server node1 node1-monstermq:1883 check inter 5s fall 3 rise 2
    server node2 node2-monstermq:1883 check inter 5s fall 3 rise 2
    server node3 node3-monstermq:1883 check inter 5s fall 3 rise 2

# GraphQL load balancer (port 4000)
frontend graphql_front
    bind *:4000
    default_backend graphql_back

backend graphql_back
    balance roundrobin
    option httpchk GET /graphql
    server node1 node1-monstermq:4000 check inter 5s fall 3 rise 2
    server node2 node2-monstermq:4000 check inter 5s fall 3 rise 2
    server node3 node3-monstermq:4000 check inter 5s fall 3 rise 2
